name: Bump Version

# Manual trigger only — auto-bumping on every push was too noisy.
# Run this workflow from the Actions tab when you're ready to publish
# a new version. Pick the level explicitly, or let the workflow infer
# it from conventional commits since the last tag.

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Bump level (leave 'auto' to infer from commits since last tag)"
        required: true
        type: choice
        default: "auto"
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Print the new version without writing or pushing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Determine bump level
        id: detect
        run: |
          if [ "${{ inputs.level }}" = "auto" ]; then
            # --detect-only prints the level on stdout and exits 0 on
            # success, 1 if no conventional commits found. Capture it.
            if LEVEL=$(python scripts/bump_version.py --detect-only 2>/dev/null); then
              echo "Auto-detected level: $LEVEL"
            else
              echo "No conventional commits since last tag — falling back to patch"
              LEVEL="patch"
            fi
          else
            LEVEL="${{ inputs.level }}"
          fi
          echo "level=$LEVEL" >> $GITHUB_OUTPUT
          echo "Bump level: $LEVEL"

      - name: Bump version
        if: inputs.dry_run == false
        id: bump
        run: |
          NEW_VERSION=$(python scripts/bump_version.py --level ${{ steps.detect.outputs.level }})
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped to $NEW_VERSION"

      - name: Commit, tag, and push
        if: inputs.dry_run == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push
          git push --tags
