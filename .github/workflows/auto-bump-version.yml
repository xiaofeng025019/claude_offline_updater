name: Auto Bump Version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip if the push was made by the bot itself (avoid infinite loop)
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect bump level from commit messages
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const commits = context.event.commits || [];
            let hasFeat = false, hasFix = false, hasBreaking = false;

            for (const c of commits) {
              const msg = c.message || '';
              const firstLine = msg.split('\n')[0];
              if (/^[a-z]+(\(.+\))?!:/.test(firstLine) || msg.includes('BREAKING CHANGE')) {
                hasBreaking = true;
              }
              if (/^feat/.test(firstLine)) {
                hasFeat = true;
              }
              if (/^fix/.test(firstLine)) {
                hasFix = true;
              }
            }

            let level = '';
            if (hasBreaking) level = 'major';
            else if (hasFeat) level = 'minor';
            else if (hasFix) level = 'patch';

            if (level) {
              core.setOutput('level', level);
              core.info(`Detected bump level: ${level}`);
            } else {
              core.setOutput('skip', 'true');
              core.info('No feat/fix commits found — skipping bump');
            }

      - name: Bump version
        if: steps.detect.outputs.skip != 'true'
        id: bump
        run: |
          NEW_VERSION=$(python scripts/bump_version.py --level ${{ steps.detect.outputs.level }})
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped to $NEW_VERSION"

      - name: Commit, tag, and push
        if: steps.detect.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push
          git push --tags
